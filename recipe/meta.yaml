{% set version = "5.4.6" %}
{% set itk_dir = "ITK-" + '.'.join(version.split('.')[:2]) %}

package:
  name: itk
  version: {{ version }}

source:
  url: https://github.com/InsightSoftwareConsortium/ITK/archive/v{{ version }}.tar.gz
  sha256: cf28bc7220c57c24ebcbabbd3b2544ea7ab65f0aad430a99f8e157738ed812b7
  patches:
    - 0001-BUG-use-check_symbol_exists-for-TIFFFieldReadCount.patch

build:
  number: 0
  # Python wrapping is version-specific; target 3.10–3.12 only.
  skip: true  # [(win and vc<14) or py<310 or py>312]

requirements:
  build:
    - cmake    >=3.16.3, <3.30.0
    - ninja
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - castxml
  host:
    - expat                     # [not win]
    - fftw
    - hdf5
    - libjpeg-turbo
    - libtiff
    - libpng                    # [not win]
    - eigen
    - zlib                      # [not win]
    - tbb-devel
    - python
    - numpy

outputs:
  # Self-contained Python package: the `itk/` module plus the C++ runtime
  # libraries it links against.
  - name: itk
    script: itk_install.sh   # [not win]
    script: itk_install.bat  # [win]
    requirements:
      run:
        - python
        - numpy
        - expat                     # [not win]
        - fftw
        - hdf5
        - libjpeg-turbo
        - libtiff
        - libpng                    # [not win]
        - eigen
        - zlib                      # [not win]
        - tbb
    test:
      requires:
        - python {{ python }}
        - numpy
      files:
        - ITK-JPEG.jpg
      imports:
        - itk
      commands:
        - itkTestDriver --no-process --compare-MD5 ITK-JPEG.jpg 959e1682d19026fc62cfbdc140df31da

  # Development content: C++ headers + module-build CMake infrastructure, plus
  # the Python wrapping source tree + Typedefs/ for building wrapped remote
  # modules against an installed ITK.
  - name: itk-devel
    build:
      run_exports:
        - {{ pin_subpackage('itk', max_pin='x.x') }}
    script: itk-devel_install.sh   # [not win]
    script: itk-devel_install.bat  # [win]
    requirements:
      build:
        - cmake
      host:
        - python
        - {{ pin_subpackage("itk", exact=True) }}
      run:
        - {{ pin_subpackage("itk", exact=True) }}
        - tbb-devel
        # ITK headers have `#include <Eigen/...>` (ITK_USE_SYSTEM_EIGEN=ON),
        # so consumers compiling against itk-devel need Eigen on the include path.
        - eigen
        - swig
        - castxml
        - pygccxml
    test:
      commands:
        - test -f $PREFIX/lib/cmake/Wrapping/CMakeLists.txt                       # [not win]
        - test -f $PREFIX/lib/cmake/{{ itk_dir }}/WrappingConfigCommon.cmake      # [not win]
        - test -f $PREFIX/lib/cmake/{{ itk_dir }}/ITKModuleExternal.cmake         # [not win]
        - if not exist %LIBRARY_PREFIX%\\lib\\cmake\\Wrapping\\CMakeLists.txt exit 1            # [win]
        - if not exist %LIBRARY_PREFIX%\\lib\\cmake\\{{ itk_dir }}\\WrappingConfigCommon.cmake exit 1  # [win]
        - if not exist %LIBRARY_PREFIX%\\lib\\cmake\\{{ itk_dir }}\\ITKModuleExternal.cmake exit 1     # [win]

about:
  home: https://www.itk.org/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: ITK is an open-source toolkit for multidimensional image analysis
  doc_url: https://itk.org/ITK/help/documentation.html
  dev_url: https://github.com/InsightSoftwareConsortium/ITK

extra:
  recipe-maintainers:
    - thewtex
    - hanayik
